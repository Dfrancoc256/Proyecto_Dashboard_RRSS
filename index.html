<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard RRSS</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/form.css" />
  <link rel="stylesheet" href="css/comentarios.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div id="authChecking">Verificando sesión...</div>

  <div id="dashboardContainer" style="display:none;">
    <aside class="sidebar">
      <h2>RRSS</h2>

      <div id="userBadge" style="margin:10px 0 18px; font-size:13px; opacity:.9;">
        <i class="fa-solid fa-user"></i>
        <span id="userEmailText">—</span>
      </div>

      <nav>
        <button data-page="home">
          <i class="fa-solid fa-chart-line"></i>
          <span>Inicio</span>
        </button>

        <button data-page="form">
          <i class="fa-solid fa-plus-circle"></i>
          <span>Nueva Gestión</span>
        </button>

        <button data-page="comentarios">
          <i class="fa-solid fa-table"></i>
          <span>Análisis de país por canal</span>
        </button>
      </nav>

      <button id="btnLogout">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Cerrar sesión</span>
      </button>
    </aside>

    <main id="content"></main>
  </div>

  <script src="data/config.js"></script>
  <script src="js/sidebar.js"></script>

  <script>
    function leerCorreoUsuarioActivo() {
      try {
        const raw = localStorage.getItem("usuarioActivo");
        if (!raw) return "";
        if (raw.includes("{")) {
          const obj = JSON.parse(raw);
          return obj?.correo || obj?.email || obj?.usuario?.correo || "";
        }
        return raw;
      } catch {
        return "";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const usuario = localStorage.getItem("usuarioActivo");
      const auth = document.getElementById("authChecking");
      const dash = document.getElementById("dashboardContainer");

      if (!usuario) {
        auth.textContent = "Redirigiendo...";
        setTimeout(() => window.location.href = "pages/login.html", 800);
        return;
      }

      const correo = leerCorreoUsuarioActivo() || "Usuario";
      const txt = document.getElementById("userEmailText");
      if (txt) txt.textContent = correo;

      auth.style.display = "none";
      dash.style.display = "flex";

      document.getElementById("btnLogout").addEventListener("click", () => {
        localStorage.removeItem("usuarioActivo");
        window.location.href = "pages/login.html";
      });
    });
  </script>
</body>
</html>
